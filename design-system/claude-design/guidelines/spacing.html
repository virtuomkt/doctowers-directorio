<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base unit" -->
<link rel="stylesheet" href="../styles.css">
<style>*{margin:0;box-sizing:border-box}body{width:700px;height:180px;padding:16px;font-family:var(--font-body);font-size:11px;color:var(--ink-500);display:flex;flex-direction:column;gap:6px}.row{display:flex;align-items:center;gap:10px}.bar{background:var(--teal-500);height:14px;border-radius:4px}</style>
<div class="row"><div class="bar" style="width:var(--space-1)"></div><span>space-1 · 4px</span></div>
<div class="row"><div class="bar" style="width:var(--space-2)"></div><span>space-2 · 8px</span></div>
<div class="row"><div class="bar" style="width:var(--space-4)"></div><span>space-4 · 16px</span></div>
<div class="row"><div class="bar" style="width:var(--space-6)"></div><span>space-6 · 24px</span></div>
<div class="row"><div class="bar" style="width:var(--space-8)"></div><span>space-8 · 32px</span></div>
<div class="row"><div class="bar" style="width:var(--space-12)"></div><span>space-12 · 48px</span></div>
<div class="row"><div class="bar" style="width:var(--space-16)"></div><span>space-16 · 64px</span></div>
